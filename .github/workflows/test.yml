name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install pytest
          pip install --no-deps git+https://github.com/nancy6547/halluguard.git
          pip install --no-deps -e .
      - name: Test
        run: pytest -q
