[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kensa"
version = "0.1.0"
description = "Metamorphic tests for RAG apps: change the input in a known way, check the answer reacts correctly."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nancy Singh"}]
dependencies = []

[project.optional-dependencies]
grounded = ["halluguard @ git+https://github.com/nancy6547/halluguard.git"]
dev = ["pytest", "halluguard @ git+https://github.com/nancy6547/halluguard.git"]

[project.scripts]
kensa = "kensa.cli:main"

[tool.setuptools]
packages = ["kensa"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
